<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Packaging Products | Zainco Packaging Industries</title>
  <meta name="description" content="Shop PP woven bags, BOPP bags, paper bags, corrugated boxes, cartons, pouches, jumbo bags and more from Zainco Packaging, Karachi.">
  <meta name="theme-color" content="#0b2545">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <div class="preloader"><div class="box-loader"><span></span></div><p>ZAINCO</p></div>

  <section class="page-hero">
    <div class="pbg" data-photo="bags" data-speed="0.3"></div>
    <div class="container">
      <div class="crumbs reveal"><a href="index.html">Home</a><span class="sep">/</span><span>Products</span></div>
      <h1 class="reveal" style="--d:.1s">Shop <span class="text-accent">packaging</span> online</h1>
      <p class="reveal" style="--d:.2s">Bags, boxes, cartons, pouches and films — order stock items or customise with your brand.</p>
    </div>
  </section>

  <section class="section">
    <div class="container shop-layout">
      <aside class="sidebar">
        <div class="side-box"><div class="search-box"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="shopSearch" type="search" placeholder="Search products…" aria-label="Search products"></div></div>
        <div class="side-box"><h4>Categories</h4><ul class="cat-filter" id="catFilter"></ul></div>
        <div class="side-box side-cta"><h4>Need a custom size?</h4><p style="font-size:.92rem">We manufacture to your exact dimensions, GSM and print design.</p><a href="contact.html#quote" class="btn btn-primary btn-sm btn-block">Request Quote</a></div>
      </aside>
      <div>
        <div class="section-head left" style="margin-bottom:24px"><h2 id="shopTitle" style="font-size:2rem">All Packaging Products</h2><p id="shopDesc"></p></div>
        <div class="shop-toolbar"><p id="resultCount"></p><select id="shopSort" aria-label="Sort products"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="name">Name: A–Z</option></select></div>
        <div class="product-grid three" id="shopGrid"></div>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
